<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub da Equipe">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Hub da Equipe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1E2124">
<style>
/* Layout: barra lateral escura fixa + área de trabalho clara; no celular vira barra inferior. */
:root{
  --bg:#F2F2EF; --surface:#FFFFFF; --surface2:#F7F7F4; --line:#E1E1DC; --line2:#ECECE8;
  --fg:#1F2226; --muted:#676C72; --faint:#9A9EA3;
  --accent:#FDBA12; --accent-soft:#FEF0C7; --accent-ink:#1F2226;
  --side:#1F2226; --side-fg:#E8E8E6; --side-muted:#9A9EA3; --side-hover:#2B2F34;
  --ok:#2E7D4F; --warn:#A86A0C; --bad:#BF3A2B; --info:#3A6EA5;
  --a-frota:#3A6EA5; --a-dev:#7A64A8; --a-gfc:#B87F00; --a-gestao:#5E6670;
  --shadow:0 1px 2px rgba(20,22,25,.06),0 4px 14px rgba(20,22,25,.05);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-head:"Segoe UI Semibold","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181B; --surface:#1E2125; --surface2:#23262B; --line:#30353B; --line2:#292D32;
  --fg:#E5E7E9; --muted:#A0A5AB; --faint:#6F757C;
  --accent:#F2B21B; --accent-soft:#3A3120; --accent-ink:#16181B;
  --side:#111315; --side-fg:#E5E7E9; --side-muted:#8D9298; --side-hover:#1E2125;
  --ok:#5DB581; --warn:#D9A441; --bad:#E57164; --info:#73A1D6;
  --a-frota:#73A1D6; --a-dev:#A996D8; --a-gfc:#F2B21B; --a-gestao:#A3AAB2;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181B; --surface:#1E2125; --surface2:#23262B; --line:#30353B; --line2:#292D32;
  --fg:#E5E7E9; --muted:#A0A5AB; --faint:#6F757C;
  --accent:#F2B21B; --accent-soft:#3A3120; --accent-ink:#16181B;
  --side:#111315; --side-fg:#E5E7E9; --side-muted:#8D9298; --side-hover:#1E2125;
  --ok:#5DB581; --warn:#D9A441; --bad:#E57164; --info:#73A1D6;
  --a-frota:#73A1D6; --a-dev:#A996D8; --a-gfc:#F2B21B; --a-gestao:#A3AAB2;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:20px}h2{font-size:16px}h3{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:4px;padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:#1F2226;display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:13px;letter-spacing:.02em}
.brand b{font-family:var(--font-head);font-size:15px;font-weight:600}
.brand small{display:block;color:var(--side-muted);font-size:11px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;border:0;background:none;color:var(--side-fg);cursor:pointer;text-align:left;width:100%;position:relative}
.nav:hover{background:var(--side-hover)}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.nav.on{background:var(--side-hover)}
.nav.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--accent);color:#1F2226;border-radius:10px;padding:0 7px;font-weight:600}
.side-sep{height:1px;background:var(--side-hover);margin:10px 4px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top h1{margin-right:auto}
.content{padding-block:20px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1400px;width:100%}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.month span{min-width:128px;text-align:center;font-weight:600;text-transform:capitalize;font-size:13px}
.iconbtn{border:0;background:none;width:32px;height:32px;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--surface2);color:var(--fg)}
.iconbtn svg{width:17px;height:17px}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px 3px 3px;cursor:pointer}
.who .nm{font-size:13px;font-weight:600}
.bottom{display:none}
.demo-bar{background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:7px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.demo-bar select{padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.linkbtn{border:0;background:none;color:var(--fg);text-decoration:underline;cursor:pointer;padding:0;font-size:inherit}

/* blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.card-h h2{margin-right:auto}
.card-b{padding:0 16px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .grow{margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(.96)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.sel,.inp{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;font-size:13px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--fg);font-weight:600}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:1px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted);border:1px solid var(--line2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent);border-color:transparent}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent);border-color:transparent}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent);border-color:transparent}
.pill.info{color:var(--info);background:color-mix(in srgb,var(--info) 12%,transparent);border-color:transparent}
.pill.acc{color:var(--fg);background:var(--accent-soft);border-color:transparent}
.pill.acc::before{background:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:4px;letter-spacing:.02em}
.tag.frota{color:var(--a-frota);background:color-mix(in srgb,var(--a-frota) 13%,transparent)}
.tag.dev{color:var(--a-dev);background:color-mix(in srgb,var(--a-dev) 13%,transparent)}
.tag.gfc{color:var(--a-gfc);background:color-mix(in srgb,var(--a-gfc) 14%,transparent)}
.tag.gestao{color:var(--a-gestao);background:color-mix(in srgb,var(--a-gestao) 15%,transparent)}
.av{display:inline-grid;place-items:center;border-radius:50%;width:26px;height:26px;font-size:10.5px;font-weight:700;flex:none;letter-spacing:.02em;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.xl{width:72px;height:72px;font-size:24px}
label.btn{cursor:pointer}
.av.frota{background:color-mix(in srgb,var(--a-frota) 22%,var(--surface));color:var(--a-frota)}
.av.dev{background:color-mix(in srgb,var(--a-dev) 22%,var(--surface));color:var(--a-dev)}
.av.gfc{background:color-mix(in srgb,var(--a-gfc) 24%,var(--surface));color:var(--a-gfc)}
.av.gestao{background:color-mix(in srgb,var(--a-gestao) 24%,var(--surface));color:var(--a-gestao)}
.avs{display:inline-flex}.avs .av{border:2px solid var(--surface);margin-left:-6px}.avs .av:first-child{margin-left:0}
.lock{display:inline-flex;align-items:center;gap:3px;color:var(--faint);font-size:11px}
.lock svg{width:12px;height:12px}

/* listas */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2);min-width:0}
.row:first-child{border-top:0}
.row .t{min-width:0;flex:1}
.row .t b{font-weight:600;display:block;overflow-wrap:anywhere}
.chk{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--faint);display:grid;place-items:center;cursor:pointer;background:none;flex:none;padding:0}
.chk svg{width:13px;height:13px;opacity:0}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.on svg{opacity:1}
.hrs{width:62px;text-align:right;padding:4px 6px;font-size:12.5px}
.done b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
details.late summary{cursor:pointer;font-size:12.5px;color:var(--bad);padding:8px 0;font-weight:600}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--font-head);font-size:26px;font-weight:600;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:4px;background:var(--line2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.meter.ok i{background:var(--ok)}.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}

/* tabelas */
.scroll-x{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr.grp td{background:var(--surface2);font-weight:600;font-size:12px;color:var(--muted);padding:6px 10px}
.clk{cursor:pointer}.clk:hover{background:var(--surface2)}
.minibar{display:flex;align-items:center;gap:8px;min-width:120px}
.minibar .meter{flex:1;margin:0}

/* calendário de rotina */
.cal{border-collapse:separate;border-spacing:0;font-size:12px}
.cal th,.cal td{border-bottom:1px solid var(--line2)}
.cal thead th{position:sticky;top:0;background:var(--surface);font-weight:600;color:var(--muted);padding:6px 0;text-align:center;width:30px;min-width:30px}
.cal thead th span{display:block;font-size:10px;font-weight:500;color:var(--faint)}
.cal thead th.hoje{color:var(--fg)}
.cal thead th.hoje::after{content:"";display:block;width:16px;height:3px;border-radius:2px;background:var(--accent);margin:3px auto 0}
.cal .stick{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:7px 12px 7px 0;min-width:230px;max-width:230px;font-weight:500;border-right:1px solid var(--line)}
.cal .stick .rt{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.cal .stick .rt:hover{text-decoration:underline}
.cal .stick .rm{display:block;font-size:11px;color:var(--faint)}
.cal td{text-align:center;padding:3px 0}
.cal td.we{background:var(--surface2)}
.cal tr.pessoa td{background:var(--surface2);padding:7px 0;text-align:left;font-weight:600}
.cal .whoin{position:sticky;left:0;display:inline-flex;align-items:center;gap:8px;padding:0 10px;white-space:nowrap}
.cal td.pct{font-weight:600;padding:0 10px;text-align:right;white-space:nowrap}
.cell{width:22px;height:22px;border-radius:5px;border:0;padding:0;cursor:pointer;display:inline-grid;place-items:center;background:var(--line2)}
.cell.done{background:var(--ok)}
.cell.done::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.cell.late{background:none;border:1.5px solid var(--bad)}
.cell.today{background:none;border:1.5px dashed var(--accent)}
.cell.fut{background:none;cursor:default}
.cell.fut::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--faint)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend .cell{width:14px;height:14px;cursor:default;vertical-align:middle;margin-right:4px}
.legend .cell.done::after{width:6px;height:3px}

/* paralelas */
.par{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:14px;align-items:center;padding:11px 16px;border-top:1px solid var(--line2);cursor:pointer}
.par:hover{background:var(--surface2)}
.par:first-child{border-top:0}
.par .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.par .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:12px;color:var(--muted)}
.par .sel{padding:4px 6px;font-size:12px}

/* projetos */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px}
.pcard:hover{border-color:var(--faint)}
.pcard p{margin:0;color:var(--muted);font-size:13px}
.pcard .foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.icard b{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.icard .f{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.icard .mv{margin-left:auto;display:flex;gap:2px}
.icard .mv button{border:1px solid var(--line);background:var(--surface);border-radius:4px;width:22px;height:20px;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:0}
.icard .mv svg{width:12px;height:12px}
.icard.late{border-left:3px solid var(--bad)}

/* gantt */
.gt{--nw:240px;min-width:calc(var(--nw) + var(--n) * var(--dw));font-size:12px}
.gt-row{display:grid;grid-template-columns:var(--nw) calc(var(--n) * var(--dw));border-bottom:1px solid var(--line2);min-height:34px}
.gt-name{position:sticky;left:0;z-index:3;background:var(--surface);padding:6px 10px 6px 0;display:flex;align-items:center;gap:7px;border-right:1px solid var(--line);min-width:0}
.gt-name b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.gt-name b:hover{text-decoration:underline}
.gt-track{position:relative;background-image:linear-gradient(to right,var(--line2) 1px,transparent 1px);background-size:var(--dw) 100%}
.gt-head .gt-track{display:flex;background:none}
.gt-head .gt-track div{width:var(--dw);flex:none;text-align:center;color:var(--faint);font-size:10.5px;padding:4px 0}
.gt-head .gt-track div.wk{color:var(--muted);font-weight:600}
.gt-head .gt-track div.td{color:var(--fg);font-weight:700}
.gt-months .gt-track div{text-align:left;padding-left:4px;color:var(--muted);font-weight:600;font-size:11px;text-transform:capitalize;white-space:nowrap;overflow:visible;border-left:1px solid var(--line)}
.gt-sprint{position:absolute;top:6px;bottom:6px;border-radius:4px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);font-size:11px;padding:0 6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;font-weight:600;cursor:pointer}
.gt-bar{position:absolute;top:8px;height:18px;border-radius:4px;background:color-mix(in srgb,var(--c) 28%,var(--surface));border:1px solid var(--c);overflow:hidden;cursor:pointer}
.gt-bar i{position:absolute;inset:0 auto 0 0;background:var(--c);opacity:.85}
.gt-bar span{position:relative;padding:0 6px;font-size:11px;line-height:16px;font-weight:600;white-space:nowrap;color:var(--fg)}
.gt-bar.late{box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 55%,transparent)}
.gt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:1}
.gt-proj{min-height:46px;background:color-mix(in srgb,var(--surface2) 60%,transparent)}
.gt-proj .gt-name{background:var(--surface)}
.gt-proj .gt-bar{top:10px;height:20px}
.gt-sub .gt-name{padding-left:18px}
.gt-sub .gt-name b{font-weight:500}
.gt-spmark{position:absolute;bottom:5px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--accent) 45%,transparent)}
.gt-proj .gt-name>div{flex:1;min-width:0}
.gt-proj .gt-name b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt-head .gt-track div.lbl{overflow:visible;white-space:nowrap;text-align:left;padding-left:2px}
.gt-dep{color:var(--bad);font-weight:700;font-size:11px;margin-left:auto;flex:none}

/* notas */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.nota{padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer}

// ---------- utilidades ----------
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dt = s => { const [a, b, c] = String(s).slice(0, 10).split('-').map(Number); return new Date(a, b - 1, c); };
const HOJE = iso(new Date());
const addDias = (s, n) => { const d = dt(s); d.setDate(d.getDate() + n); return iso(d); };
const diasEntre = (a, b) => Math.round((dt(b) - dt(a)) / 864e5);
const diasMes = (y, m) => new Date(y, m + 1, 0).getDate();
const util = s => { const g = dt(s).getDay(); return g > 0 && g < 6; };
const uteisEntre = (a, b) => { const o = []; if (!a || !b) return o; for (let d = a; d <= b; d = addDias(d, 1)) if (util(d)) o.push(d); return o; };
const fmtD = s => s ? `${pad(dt(s).getDate())}/${pad(dt(s).getMonth() + 1)}` : '—';
const fmtH = h => (Math.round((Number(h) || 0) * 10) / 10).toLocaleString('pt-BR') + ' h';
const fmt1 = v => (Math.round((Number(v) || 0) * 10) / 10).toLocaleString('pt-BR');
const hm = h => h ? String(h).slice(0, 5) : '';
const agoraHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const vencido = (d, hora) => !!d && (d < HOJE || (d === HOJE && !!hora && hm(hora) < agoraHM()));
const plDias = n => n + (n === 1 ? ' dia' : ' dias');
const pct = (a, b) => b ? Math.round(a / b * 100) : null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x' + Math.random().toString(36).slice(2) + Date.now().toString(36));
const semAcento = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};
const inicial = n => String(n || '?').split(/\s+/).filter(Boolean).map(x => x[0]).slice(0, 2).join('').toUpperCase();
const semanaDe = d => { const x = dt(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return iso(x); };

const ICON = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  rot: '<path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7M20 4v4.7h-4.7M20 12a8 8 0 0 1-13.7 5.6L4 15.3M4 20v-4.7h4.7"/>',
  par: '<path d="M13 3 5 14h6l-1 7 8-11h-6z"/>',

  plus: '<path d="M12 5v14M5 12h14"/>',
  left: '<path d="m15 18-6-6 6-6"/>',
  right: '<path d="m9 18 6-6-6-6"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',

  down: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  print: '<path d="M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-2M7 14h10v6H7z"/>',
  alvo: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>'

const ic = (n, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICON[n]}</svg>`;

// ---------- estado ----------
const now = new Date();
const S = {
  modo: 'teste', me: null, sessao: null,
  pessoas: [], rotinas: [], exec: [], paralelas: [], etapas: [], notas: [], projetos: [], sprints: [], itens: [],
  execMap: new Map(),
  view: ls.get('hub-view', 'inicio'),
  y: now.getFullYear(), m: now.getMonth(),

const P = id => S.pessoas.find(p => p.id === id);
const isGestao = p => !!p && (p.papel === 'coordenador' || p.papel === 'lider');

  if (!ets.length) return null;

function unidades() {
  const out = [];
  S.paralelas.forEach(a => {
    const ets = etapasDe(a.id);
    if (ets.length) {
      ets.forEach(e => { if (e.responsavel_id) out.push({ tipo: 'etapa', id: e.id, pid: e.responsavel_id, titulo: e.titulo, pai: a.titulo, due: e.fim, hora: e.hora, inicio: e.inicio, concl: e.concluida_em, done: e.status === 'concluida', horas: Number(e.horas_real) || 0, origem: a.origem }); });

function ocorrencias(r, y, m) {
  if (r.ativo === false) return [];
  const out = [], n = diasMes(y, m);
  if (r.frequencia === 'mensal') {
    const d = Math.min(Number(r.dia_mes) || 1, n);
    const x = new Date(y, m, d), g = x.getDay();
    if (g === 6) x.setDate(d > 1 ? d - 1 : d + 2);
    if (g === 0) x.setDate(d > 2 ? d - 2 : d + 1);
    out.push(iso(x));
  } else {
    for (let d = 1; d <= n; d++) {
      const x = new Date(y, m, d), g = x.getDay();
      if (g === 0 || g === 6) continue;
      if (r.frequencia === 'diaria' || (r.frequencia === 'semanal' && g === Number(r.dia_semana))) out.push(iso(x));
    }
  }
  const ini = r.inicio ? String(r.inicio).slice(0, 10) : null;
  return out.filter(s => !ini || s >= ini);
}

function indicadores(ids, y, m) {
  const set = new Set(ids);
  const mesIni = iso(new Date(y, m, 1)), mesFim = iso(new Date(y, m + 1, 0));
  const noMes = d => d && d >= mesIni && d <= mesFim;
  const pp = {}, semanas = {}, origem = {};
  ids.forEach(id => pp[id] = { esperadas: 0, feitas: 0, naoReal: 0, hPrev: 0, hReal: 0, entregas: 0, noPrazo: 0, abertos: 0, atrasados: 0, diasAberto: 0, hPar: 0, horasDia: {}, rotHoras: {} });
  const addH = (id, d, k, h) => { if (!h) return; const o = pp[id].horasDia[d] = pp[id].horasDia[d] || { rot: 0, par: 0 }; o[k] += h; };
  const addSem = (d, k) => { const s = semanaDe(d); semanas[s] = semanas[s] || { rot: 0, ent: 0 }; semanas[s][k]++; };
  S.rotinas.filter(r => set.has(r.dono_id)).forEach(r => {
    const x = pp[r.dono_id];
    ocorrencias(r, y, m).forEach(d => {
      if (d > HOJE) return;
      const e = execDe(r.id, d);
      if (d === HOJE && !e) return;
      x.esperadas++; x.hPrev += Number(r.horas_prev) || 0;
      if (e) {
        const h = Number(e.horas_real ?? r.horas_prev) || 0;
        x.feitas++; x.hReal += h; addH(r.dono_id, d, 'rot', h); addSem(d, 'rot');
        x.rotHoras[r.titulo] = (x.rotHoras[r.titulo] || 0) + h;
      } else x.naoReal++;
    });
  });
  unidades().forEach(u => {
    if (!set.has(u.pid)) return;
    const x = pp[u.pid];
    if (u.done) {
      if (noMes(u.concl)) { x.entregas++; if (!u.due || u.concl <= u.due) x.noPrazo++; addSem(u.concl, 'ent'); }
    } else if (!u.inicio || u.inicio <= mesFim) {
      x.abertos++;
      if (u.due && vencido(u.due, u.hora)) { x.atrasados++; x.diasAberto += Math.max(0, diasEntre(u.due, HOJE)); }
    }
    if (u.horas > 0 && u.tipo !== 'item') {
      const fim = u.concl || HOJE;
      let dias = uteisEntre(u.inicio && u.inicio <= fim ? u.inicio : fim, fim); if (!dias.length) dias = [fim];
      const per = u.horas / dias.length;
      dias.forEach(d => { if (noMes(d)) { addH(u.pid, d, 'par', per); x.hPar += per; } });
    }
  });
  S.paralelas.forEach(a => {
    if (!pessoasPar(a).concat(a.criado_por).some(p => set.has(p))) return;
    const criado = String(a.criado_em).slice(0, 10);
    if (noMes(criado) || noMes(a.concluida_em) || (a.status !== 'concluida' && criado <= mesFim)) origem[a.origem] = (origem[a.origem] || 0) + 1;
  });
  ids.forEach(id => {
    const x = pp[id], p = P(id), dias = Object.keys(x.horasDia).filter(noMes).sort();
    const tot = dias.map(d => x.horasDia[d].rot + x.horasDia[d].par);
    x.diasReg = dias.length; x.mediaDia = dias.length ? tot.reduce((a, b) => a + b, 0) / dias.length : 0;
    x.carga = carga(p); x.acima = tot.filter(t => t > x.carga + 0.01).length;
    const iMax = tot.indexOf(Math.max(0, ...tot)); x.pico = tot.length ? tot[iMax] : 0; x.diaPico = dias[iMax] || null;
    const top = Object.entries(x.rotHoras).sort((a, b) => b[1] - a[1])[0]; x.maiorRot = top ? { titulo: top[0], h: top[1] } : null;
  });
  const tot = {};
  Object.values(pp).forEach(x => { for (const k in x) if (typeof x[k] === 'number') tot[k] = (tot[k] || 0) + x[k]; });
  return { pp, tot, semanas, origem, mesIni, mesFim };
}

// Pontos de atenção: regras simples e explicáveis
function pontosAtencao(I, pessoas) {
  const out = [];
  pessoas.forEach(p => {
    const x = I.pp[p.id], nome = p.nome.split(' ')[0];
    if (isFrota(p) && x.acima >= 1) out.push({ sev: x.acima >= 3 ? 'bad' : 'warn', p, txt: `${nome} passou da jornada de ${fmt1(x.carga)} h em ${x.acima} ${x.acima === 1 ? 'dia' : 'dias'} (pico de ${fmtH(x.pico)} em ${fmtD(x.diaPico)}).${x.maiorRot ? ` A rotina que mais consome é “${x.maiorRot.titulo}”, com ${fmtH(x.maiorRot.h)} no mês.` : ''}`, acao: 'Rever o tempo previsto dessa rotina, simplificar a coleta ou redistribuir paralelas para outra pessoa da área.' });
    if (isFrota(p) && x.hPrev > 0 && x.hReal > x.hPrev * 1.2) out.push({ sev: 'warn', p, txt: `A rotina de ${nome} está levando ${pct(x.hReal - x.hPrev, x.hPrev)}% mais tempo que o previsto (${fmtH(x.hReal)} contra ${fmtH(x.hPrev)}).`, acao: 'Atualizar a previsão ou investigar o gargalo: dado que chega atrasado, retrabalho ou ferramenta lenta.' });
    if (isFrota(p) && x.hPar + x.hReal > 0 && x.hPar / (x.hPar + x.hReal) > 0.35) out.push({ sev: 'warn', p, txt: `Paralelas ocuparam ${pct(x.hPar, x.hPar + x.hReal)}% das horas registradas por ${nome}.`, acao: 'Alinhar com o analista quais demandas externas têm prioridade sobre a rotina do site.' });
    const ad = pct(x.feitas, x.esperadas);
    if (x.esperadas >= 5 && ad < 80) out.push({ sev: ad < 65 ? 'bad' : 'warn', p, txt: `Aderência à rotina de ${nome} em ${ad}% (${x.naoReal} ${x.naoReal === 1 ? 'execução não realizada' : 'execuções não realizadas'}).`, acao: 'Verificar se a rotina está bem dimensionada ou se há impedimento recorrente.' });
    if (x.atrasados >= 2) out.push({ sev: 'warn', p, txt: `${nome} tem ${x.atrasados} entregas atrasadas, em média ${plDias(Math.round(x.diasAberto / x.atrasados))} após o prazo.`, acao: 'Repactuar prazos na reunião semanal ou dividir a demanda em etapas com outras pessoas.' });
  });
  return out.sort((a, b) => (a.sev === 'bad' ? 0 : 1) - (b.sev === 'bad' ? 0 : 1));
}

function viewAtual() {
  switch (S.view) {
    case 'rotina': return vRotina();
    case 'paralelas': return vParalelas();
    case 'projetos': return vProjetos();
    case 'projeto': return vProjeto();

function linhaAgenda(x) {
  const late = !x.feito && x.tipo !== 'rotina' ? vencido(x.d, x.hora) : (!x.feito && x.d < HOJE);
  const e = x.tipo === 'rotina' ? execDe(x.id, x.d) : null;
  const horas = x.tipo === 'rotina' && e && isFrota(P(x.ref.dono_id));
  return `<div class="ag ${x.feito ? 'done' : ''}" style="--c:var(${TIPO[x.tipo].cor})">
    <button class="chk ${x.feito ? 'on' : ''}" data-act="togAg" data-t="${x.tipo}" data-id="${x.id}" data-d="${x.d}" aria-label="${x.feito ? 'Desmarcar' : 'Concluir'}">${ic('check')}</button>
    <div class="t" data-act="abrirAg" data-t="${x.tipo}" data-id="${x.id}" data-d="${x.d}"><b>${esc(x.titulo)}</b>
      <span class="small muted">${TIPO[x.tipo].nome}${x.sub ? ' · ' + esc(x.sub) : ''}${x.hora ? ` · <span ${late ? 'style="color:var(--bad);font-weight:600"' : ''}>até ${hm(x.hora)}</span>` : ''}${late && !x.hora ? ' · <span style="color:var(--bad);font-weight:600">atrasada</span>' : ''}</span></div>
    ${horas ? `<input class="inp hrs num" type="number" step="0.25" min="0" value="${e.horas_real ?? ''}" data-chg="horasExec" data-r="${x.id}" data-d="${x.d}" aria-label="Horas reais" title="Horas reais">` : ''}

}
function barraCaptura() {

  return `<form class="cap card" data-form="captura">
    <div class="seg">${tipos.map(([v, t]) => `<button type="button" class="${S.capTipo === v ? 'on' : ''}" data-act="capTipo" data-v="${v}">${t}</button>`).join('')}</div>
    <input class="inp" id="cap-texto" name="texto" autocomplete="off" placeholder="${ph}" aria-label="Captura rápida">
    ${S.capTipo === 'paralela' ? `<input class="inp" type="date" id="cap-data" name="data" value="${S.dia}" aria-label="Prazo"><input class="inp" type="time" id="cap-hora" name="hora" aria-label="Até que horas (opcional)" title="Até que horas (opcional)">` : ''}
    <button class="btn pri" type="submit">${ic('plus')}Adicionar</button></form>`;
}
function vInicio() {
  const me = S.me, diario = modoDiario();

    ? `<div class="month"><button class="iconbtn" data-act="diaNav" data-d="-1" aria-label="Dia anterior">${ic('left')}</button><span>${S.dia === HOJE ? 'Hoje' : DIAS[d0.getDay()] + ', ' + fmtD(S.dia)}</span><button class="iconbtn" data-act="diaNav" data-d="1" aria-label="Próximo dia">${ic('right')}</button></div>${S.dia !== HOJE ? '<button class="btn sm" data-act="diaHoje">Hoje</button>' : ''}`
    : S.inicioTab === 'mes' ? `<div class="month"><button class="iconbtn" data-act="mesInicio" data-d="-1" aria-label="Mês anterior">${ic('left')}</button><span>${MESES[d0.getMonth()]} ${d0.getFullYear()}</span><button class="iconbtn" data-act="mesInicio" data-d="1" aria-label="Próximo mês">${ic('right')}</button></div>` : '';

function inicioDia() {
  const me = S.me, diario = modoDiario();
  const lista = agendaDia(me.id, S.dia), atras = S.dia === HOJE ? atrasadosDe(me.id) : [];
  const feitos = lista.filter(x => x.feito).length;
  const d0 = dt(HOJE), I = indicadores([me.id], d0.getFullYear(), d0.getMonth()), x = I.pp[me.id];
  const ad = pct(x.feitas, x.esperadas);
  const fixadas = S.notas.filter(n => n.fixada && !n.data).slice(0, 3);
  const diarioNota = S.notas.find(n => n.data === S.dia);
  return `<div class="grid2">
    <div class="stack">
      <section class="card"><div class="card-h"><h2>${S.dia === HOJE ? 'Agenda de hoje' : 'Agenda de ' + fmtD(S.dia)}</h2><span class="muted small num">${feitos} de ${lista.length} concluídas</span></div>
        <div class="card-b"><div class="rows">${lista.length ? lista.map(linhaAgenda).join('') : '<div class="empty">Nada previsto para este dia.</div>'}</div>
        ${atras.length ? `<details class="late" ${diario ? 'open' : ''}><summary>${atras.length} ${atras.length === 1 ? 'pendência ficou' : 'pendências ficaram'} para trás</summary><div class="rows">${atras.map(linhaAgenda).join('')}</div></details>` : ''}
        </div></section>
      ${diario ? `<section class="card"><div class="card-h"><h2>Diário do dia</h2>${lock()}</div><div class="card-b"><textarea class="inp" id="diario-txt" data-chg="diario" data-d="${S.dia}" style="width:100%;min-height:110px" placeholder="Como foi o dia, o que travou, o que ficou para amanhã. Salva ao sair do campo.">${esc(diarioNota ? diarioNota.texto || '' : '')}</textarea></div></section>` : ''}
    </div>
    <div class="stack">
      <section class="card"><div class="card-h"><h2>Meu mês</h2><span class="muted small" style="text-transform:capitalize">${MESES[d0.getMonth()]}</span></div>
        <div class="card-b">
          <div class="hbar"><span>Aderência à rotina</span>${meter(ad, corPct(ad))}<b class="num">${ad == null ? '—' : ad + '%'}</b></div>
          <div class="kv"><span>Entregas concluídas</span><b class="num">${x.entregas}${x.entregas ? ` <span class="muted small">· ${pct(x.noPrazo, x.entregas)}% no prazo</span>` : ''}</b></div>
          <div class="kv"><span>Em aberto</span><b class="num">${x.abertos}${x.atrasados ? ` <span style="color:var(--bad)">· ${x.atrasados} atrasadas</span>` : ''}</b></div>
          ${isFrota(me) ? `<div class="kv"><span>Média por dia</span><b class="num" ${x.mediaDia > x.carga ? 'style="color:var(--bad)"' : ''}>${fmtH(x.mediaDia)} <span class="muted small">de ${fmtH(x.carga)}</span></b></div>
          <div class="kv"><span>Dias acima da jornada</span><b class="num" ${x.acima ? 'style="color:var(--bad)"' : ''}>${x.acima}</b></div>` : ''}
        </div></section>
      <section class="card"><div class="card-h"><h2>Notas fixadas</h2>${lock()}<button class="btn sm" data-act="ir" data-v="notas">Abrir notas</button></div>
        <div class="card-b"><div class="rows">${fixadas.length ? fixadas.map(n => `<div class="row clk" data-act="editarNota" data-id="${n.id}"><div class="t"><b>${esc(n.titulo || 'Sem título')}</b><span class="small muted">${esc((n.texto || '').slice(0, 90))}</span></div></div>`).join('') : '<div class="empty">Fixe uma nota para ela aparecer aqui.</div>'}</div></div></section>
    </div></div>`;
}
function inicioMes() {
  const me = S.me, d0 = dt(S.dia), y = d0.getFullYear(), m = d0.getMonth(), n = diasMes(y, m);
  const pre = new Date(y, m, 1).getDay();
  let cells = '';
  for (let k = 0; k < pre; k++) cells += '<div class="mc vazio"></div>';
  const lista = [];
  for (let dd = 1; dd <= n; dd++) {
    const d = iso(new Date(y, m, dd)), ag = agendaDia(me.id, d);
    const tarefas = ag.filter(x => x.tipo !== 'rotina'), rot = ag.filter(x => x.tipo === 'rotina');
    lista.push(...tarefas);
    const pend = ag.filter(x => !x.feito).length;
    const escrito = S.notas.some(x => x.data === d);
    cells += `<button class="mc ${d === HOJE ? 'hoje' : ''} ${dt(d).getDay() % 6 === 0 ? 'fds' : ''}" data-act="abrirDia" data-d="${d}" aria-label="${fmtD(d)}">
      <span class="mc-h"><b>${dd}</b>${pend ? `<span class="mc-n ${d < HOJE ? 'bad' : ''}">${pend}</span>` : ''}</span>
      ${tarefas.slice(0, 3).map(x => `<span class="mc-t ${x.feito ? 'ok' : ''}" style="--c:var(${TIPO[x.tipo].cor})">${esc(x.titulo)}</span>`).join('')}
      ${tarefas.length > 3 ? `<span class="mc-mais">+${tarefas.length - 3}</span>` : ''}
      ${rot.length ? `<span class="mc-r">Rotina ${rot.filter(x => x.feito).length}/${rot.length}</span>` : ''}
      ${escrito ? '<i class="mc-diario" title="Diário escrito"></i>' : ''}</button>`;
  }
  const pend = lista.filter(x => !x.feito).length;
  lista.sort((a, b) => (a.feito - b.feito) || (a.d < b.d ? -1 : 1));
  return `<div class="mes-wrap">
    <section class="card"><div class="card-b" style="padding-top:12px"><div class="mgrid">${DIAS.map(d => `<div class="mg-h">${d}</div>`).join('')}${cells}</div>
      <div class="small muted" style="margin-top:10px">Número: pendências do dia (vermelho se o dia já passou)${modoDiario() ? ' · traço amarelo: diário escrito' : ''} · toque no dia para abrir.</div></div></section>
    <section class="card"><div class="card-h"><h2>Tarefas do mês</h2><span class="muted small num">${pend} pendentes de ${lista.length}</span></div>
      <div>${lista.length ? lista.map(x => `<div class="tm ${x.feito ? 'done' : ''}" style="--c:var(${TIPO[x.tipo].cor})" data-act="abrirAg" data-t="${x.tipo}" data-id="${x.id}" data-d="${x.d}"><span class="num muted">${fmtD(x.d)}</span><span class="t">${esc(x.titulo)}${x.hora ? ` <span class="muted small">até ${hm(x.hora)}</span>` : ''}</span></div>`).join('') : '<div class="empty">Nenhuma tarefa com prazo neste mês.</div>'}</div></section>
  </div>`;
}
function filaFoco() {
  const atr = atrasadosDe(S.me.id), hoje = agendaDia(S.me.id, HOJE).filter(x => !x.feito);
  const prio = x => x.tipo === 'paralela' ? ({ alta: 0, media: 1, baixa: 2 }[(S.paralelas.find(a => a.id === x.id) || {}).prioridade] ?? 1) : 1;
  return [...atr, ...hoje.sort((a, b) => (hm(a.hora) || '99').localeCompare(hm(b.hora) || '99') || prio(a) - prio(b))];
}
function inicioFoco() {
  const fila = filaFoco();
  if (!fila.length) return `<section class="card foco"><div class="foco-vazio"><h2>Tudo em dia</h2><p class="muted">Não há pendências para hoje nem atrasadas. Use a aba Dia para capturar algo novo.</p></div></section>`;
  if (S.focoIdx >= fila.length) S.focoIdx = 0;
  const x = fila[S.focoIdx], late = x.d < HOJE || vencido(x.d, x.hora);
  return `<section class="card foco" style="--c:var(${TIPO[x.tipo].cor})">
    <div class="foco-top"><span class="pill nodot">${TIPO[x.tipo].nome}</span>${late ? '<span class="pill bad">Atrasada</span>' : ''}<span class="muted small num" style="margin-left:auto">${S.focoIdx + 1} de ${fila.length}</span></div>
    <h2 class="foco-t">${esc(x.titulo)}</h2>
    <div class="muted">${esc(x.sub || '')}${x.hora ? ' · até ' + hm(x.hora) : ''}${x.d !== HOJE ? ' · prazo ' + fmtD(x.d) : ''}</div>
    <div class="foco-timer"><span id="timer" class="num">${S.foco ? '' : '25:00'}</span>
      <div class="toolbar" style="justify-content:center">${S.foco ? '<button class="btn" data-act="timerParar">Parar</button>' : '<button class="btn" data-act="timer" data-m="25">Focar 25 min</button><button class="btn" data-act="timer" data-m="10">10 min</button>'}</div></div>
    <div class="toolbar foco-acoes"><button class="btn" data-act="abrirAg" data-t="${x.tipo}" data-id="${x.id}" data-d="${x.d}">Abrir detalhes</button><button class="btn" data-act="focoPular">Pular para a próxima</button><button class="btn pri" data-act="togAg" data-t="${x.tipo}" data-id="${x.id}" data-d="${x.d}">${ic('check')}Concluir</button></div>
  </section>
  <div class="small muted">A fila começa pelo que está atrasado e segue pela hora-limite de hoje. Uma coisa de cada vez.</div>`;
}
let timerT;
function atualizarTimer() {
  clearInterval(timerT);
  const el = () => document.getElementById('timer');
  if (!S.foco) return;
  const tick = () => {
    const r = Math.max(0, Math.round((S.foco - Date.now()) / 1000));
    if (el()) el().textContent = pad(Math.floor(r / 60)) + ':' + pad(r % 60);
    if (r <= 0) { clearInterval(timerT); S.foco = null; toast('Tempo de foco encerrado. Faça uma pausa curta.'); render(); }
  };
  tick(); timerT = setInterval(tick, 1000);
}

function vRotina() {
  const ids = idsEscopo(S.escopo), y = S.y, m = S.m, n = diasMes(y, m);
  const dias = Array.from({ length: n }, (_, i) => iso(new Date(y, m, i + 1)));
  const pessoas = ids.map(P).filter(Boolean).sort((a, b) => (a.area + a.nome).localeCompare(b.area + b.nome));
  let body = '';
  pessoas.forEach(p => {
    const rs = S.rotinas.filter(r => r.dono_id === p.id && r.ativo !== false).sort((a, b) => ['diaria', 'semanal', 'mensal'].indexOf(a.frequencia) - ['diaria', 'semanal', 'mensal'].indexOf(b.frequencia));
    if (pessoas.length > 1) body += `<tr class="pessoa"><td colspan="${n + 2}"><span class="whoin">${av(p)} ${esc(p.nome)} <span class="muted small">· ${PAPEIS[p.papel]}${frotaTxt(p) ? ' · ' + esc(frotaTxt(p)) : ''}</span></span></td></tr>`;
    if (!rs.length) { body += `<tr><td colspan="${n + 2}" class="muted small" style="text-align:left;padding:8px 0">Sem rotinas cadastradas.</td></tr>`; return; }
    rs.forEach(r => {
      const oc = new Set(ocorrencias(r, y, m));
      let esp = 0, f = 0;
      const cels = dias.map(d => {
        const g = dt(d).getDay(), we = g === 0 || g === 6;
        if (!oc.has(d)) return `<td class="${we ? 'we' : ''}"></td>`;
        const st = estadoCel(r.id, d);
        if (st === 'done' || st === 'late') esp++; if (st === 'done') f++;
        return `<td><button class="cell ${st}" data-act="cel" data-r="${r.id}" data-d="${d}" title="${fmtD(d)} — ${st === 'done' ? 'feito' : st === 'late' ? 'não realizado' : st === 'today' ? 'hoje' : 'previsto'}" aria-label="${esc(r.titulo)} ${fmtD(d)}"></button></td>`;
      }).join('');
      const v = pct(f, esp);
      body += `<tr><th class="stick" scope="row"><span class="rt" data-act="editarRot" data-id="${r.id}">${esc(r.titulo)}</span><span class="rm">${quandoRotina(r)}${isFrota(p) ? ' · ' + fmtH(r.horas_prev) : ''}${r.privada ? ' · privada' : ''}</span></th>${cels}<td class="pct num" style="color:var(--${corPct(v) || 'faint'})">${v == null ? '—' : v + '%'}</td></tr>`;
    });
  });
  return `
  <div class="toolbar">${selEscopo(false)}<div class="grow toolbar"><button class="btn pri" data-act="novaRot">${ic('plus')}Nova rotina</button></div></div>
  <section class="card"><div class="card-b" style="padding-top:12px">
    <div class="scroll-x" data-key="cal"><table class="cal"><thead><tr><th class="stick" style="z-index:3"></th>${dias.map(d => { const g = dt(d).getDay(); return `<th ${d === HOJE ? 'class="hoje" data-hoje' : ''}><span>${DIAS[g][0]}</span>${dt(d).getDate()}</th>`; }).join('')}<th style="width:56px">mês</th></tr></thead><tbody>${body}</tbody></table></div>
  </div></section>
  <div class="legend"><span><i class="cell done"></i>Feito</span><span><i class="cell late"></i>Não realizado</span><span><i class="cell today"></i>Hoje</span><span><i class="cell fut"></i>Previsto</span><span>Clique no nome da rotina para editar e num quadrinho para registrar.</span></div>`;
}

function linhaPar(a) {
  const ets = etapasDe(a.id), criador = P(a.criado_por);
  const feitas = ets.filter(e => e.status === 'concluida').length;
  const prox = ets.find(e => e.status !== 'concluida');
  return `<div class="par" data-act="editarPar" data-id="${a.id}">

function filtrarParalelas() {

    if (S.parMinhas) { if (!pessoasPar(a).includes(S.me.id)) return false; }

    if (q && !semAcento(a.titulo + ' ' + (a.descricao || '') + ' ' + (a.solicitante || '') + ' ' + etapasDe(a.id).map(e => e.titulo).join(' ')).includes(q)) return false;

    if (S.parFiltro === 'concluidas') return !aberta && a.concluida_em >= mesIni && a.concluida_em <= mesFim;

function graficoHoras(p, x, y, m) {
  const fimMes = iso(new Date(y, m + 1, 0)), ate = HOJE < fimMes ? HOJE : fimMes;
  const dias = uteisEntre(iso(new Date(y, m, 1)), ate).concat(Object.keys(x.horasDia).filter(d => !util(d) && d.slice(0, 7) === ate.slice(0, 7))).sort();
  if (!dias.length) return '<div class="empty">Sem dias no período.</div>';
  const vals = dias.map(d => x.horasDia[d] || { rot: 0, par: 0 });
  const max = Math.max(x.carga * 1.25, ...vals.map(v => v.rot + v.par));
  const topo = Math.ceil(max / 2) * 2;
  const W = 340, H = 150, L = 22, B = 18, T = 14, bw = (W - L - 4) / dias.length;
  const yy = v => H - B - (v / topo) * (H - B - T);
  let s = '';
  for (let v = 0; v <= topo; v += 2) s += `<line x1="${L}" x2="${W}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line2)"/><text x="${L - 5}" y="${yy(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--faint)">${v}</text>`;
  dias.forEach((d, k) => {
    const v = vals[k], x0 = L + 2 + k * bw, w = Math.max(2, bw * 0.66), tot = v.rot + v.par, acima = tot > x.carga + 0.01;
    const tip = `${fmtD(d)}: ${fmt1(tot)} h (rotina ${fmt1(v.rot)} h, paralelas ${fmt1(v.par)} h)`;
    if (v.rot) s += `<rect x="${x0}" y="${yy(v.rot)}" width="${w}" height="${yy(0) - yy(v.rot)}" fill="${acima ? 'var(--bad)' : 'var(--info)'}"><title>${tip}</title></rect>`;
    if (v.par) s += `<rect x="${x0}" y="${yy(tot)}" width="${w}" height="${yy(v.rot) - yy(tot)}" fill="var(--accent)"><title>${tip}</title></rect>`;
    if (!tot) s += `<rect x="${x0}" y="${yy(0) - 2}" width="${w}" height="2" fill="var(--line)"><title>${fmtD(d)}: sem registro</title></rect>`;
    if (k % 3 === 0 || dias.length <= 12) s += `<text x="${x0 + w / 2}" y="${H - 5}" text-anchor="middle" font-size="9.5" fill="var(--faint)">${dt(d).getDate()}</text>`;
  });
  s += `<line x1="${L}" x2="${W}" y1="${yy(x.carga)}" y2="${yy(x.carga)}" stroke="var(--bad)" stroke-dasharray="4 3"/><text x="${W - 2}" y="${yy(x.carga) - 4}" text-anchor="end" font-size="10" fill="var(--bad)">jornada ${fmt1(x.carga)} h</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Horas por dia de ${esc(p.nome)}">${s}</svg>`;
}

function carregarScript(src) {
  return new Promise((ok, err) => {
    const s = document.createElement('script'); s.src = src; s.onload = ok;
    s.onerror = () => err(new Error('Não foi possível carregar o gerador de apresentação. Verifique a internet.'));
    document.head.appendChild(s);
  });
}

function lerEtapas() {

// seletor de pessoas (marcação)
function montarMencoes(sel, onChange) {
  const box = document.getElementById('ment'), hid = document.getElementById('f-responsaveis');
  let ids = sel.slice(), q = '', hi = 0, aberto = false;
  const cands = () => ativos().filter(p => !ids.includes(p.id) && semAcento(p.nome + ' ' + AREAS[p.area].nome).includes(semAcento(q)));
  const draw = (foco) => {
    hid.value = ids.join(',');
    const cand = cands().slice(0, 8);
    box.innerHTML = ids.map(id => { const p = P(id); return p ? `<span class="chip">${av(p, false)}${esc(p.nome)}<button type="button" data-rm="${id}" aria-label="Remover ${esc(p.nome)}">×</button></span>` : ''; }).join('') +
      `<input id="f-ment" placeholder="${ids.length ? 'Marcar mais alguém' : '@ Digite um nome'}" value="${esc(q)}" autocomplete="off">` +
      (aberto ? `<div class="dd">${cand.map((p, k) => `<div data-add="${p.id}" class="${k === hi ? 'on' : ''}">${av(p, false)}<span>${esc(p.nome)}</span><span class="muted small" style="margin-left:auto">${AREAS[p.area].curto}</span></div>`).join('') || '<div class="muted">Ninguém encontrado</div>'}</div>` : '');
    const i = box.querySelector('input');
    if (foco) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    i.addEventListener('input', () => { q = i.value.replace(/^@/, ''); hi = 0; aberto = true; draw(true); });
    i.addEventListener('focus', () => { if (!aberto) { aberto = true; draw(true); } });
    i.addEventListener('keydown', ev => {
      const c = cands().slice(0, 8);
      if (ev.key === 'ArrowDown') { ev.preventDefault(); hi = Math.min(c.length - 1, hi + 1); draw(true); }
      else if (ev.key === 'ArrowUp') { ev.preventDefault(); hi = Math.max(0, hi - 1); draw(true); }
      else if (ev.key === 'Enter') { ev.preventDefault(); if (c[hi]) { ids.push(c[hi].id); q = ''; hi = 0; draw(true); onChange && onChange(ids); } }
      else if (ev.key === 'Backspace' && !i.value && ids.length) { ids.pop(); draw(true); onChange && onChange(ids); }
      else if (ev.key === 'Escape' || ev.key === 'Tab') { aberto = false; q = ''; draw(ev.key === 'Escape'); }
    });
  };
  box.addEventListener('mousedown', ev => {
    const add = ev.target.closest('[data-add]'), rm = ev.target.closest('[data-rm]');
    if (add) { ev.preventDefault(); ids.push(add.dataset.add); q = ''; hi = 0; draw(true); onChange && onChange(ids); }
    else if (rm) { ev.preventDefault(); ids = ids.filter(x => x !== rm.dataset.rm); draw(aberto); onChange && onChange(ids); }
  });
  // fecha a lista ao clicar em qualquer lugar fora do campo
  const fora = ev => {
    if (!box.isConnected) { document.removeEventListener('mousedown', fora, true); return; }
    if (aberto && !box.contains(ev.target)) { aberto = false; q = ''; draw(false); }
  };
  document.addEventListener('mousedown', fora, true);
  draw(false);
}

// ---------- foto de perfil: recorta o centro e reduz para 160×160 ----------
function reduzirFoto(file) {
  return new Promise((ok, err) => {
    if (!file || !/^image\//.test(file.type)) return err(new Error('Escolha um arquivo de imagem.'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const L = 160, lado = Math.min(img.naturalWidth, img.naturalHeight);
      const c = document.createElement('canvas'); c.width = c.height = L;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, L, L);
      g.drawImage(img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2, lado, lado, 0, 0, L, L);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); err(new Error('Não foi possível ler essa imagem. Tente uma foto em JPG ou PNG.')); };
    img.src = url;
  });
}

function mencoesDoTexto(t) {
  const ids = [];
  const limpo = t.replace(/@([\p{L}]+)/gu, (m, nome) => {
    const n = semAcento(nome), p = ativos().find(x => semAcento(x.nome).split(/\s+/)[0] === n) || ativos().find(x => semAcento(x.nome).startsWith(n));
    if (p) { ids.push(p.id); return ''; }
    return m;
  }).replace(/\s{2,}/g, ' ').trim();
  return { limpo, ids: [...new Set(ids)] };
}

function togAg(t, id, d) {
  if (t === 'rotina') {
    const r = S.rotinas.find(x => x.id === id);
    if (execDe(id, d)) return salvar(() => API.desmarcarExec(id, d));
    return salvar(() => API.marcarExec(id, d, isFrota(P(r.dono_id)) ? Number(r.horas_prev) || 0 : null, null));
  }
  if (t === 'paralela') {
    const a = S.paralelas.find(x => x.id === id);
    if (etapasDe(id).length) { modalParalela(a); toast('Esta atividade tem etapas: conclua pelas etapas.'); return; }
    if (a.status !== 'concluida' && a.responsaveis.some(r => isFrota(P(r)))) return modalConcluirHoras('paralela', id);
    const fim = a.status !== 'concluida';
    return salvar(() => API.atualizar('paralelas', id, { status: fim ? 'concluida' : 'a_fazer', concluida_em: fim ? HOJE : null }), fim ? 'Concluída' : null);
  }
  if (t === 'etapa') {
    const e = S.etapas.find(x => x.id === id), fim = e.status !== 'concluida';
    if (fim && isFrota(P(e.responsavel_id))) return modalConcluirHoras('etapa', id);
    return salvar(() => concluirEtapa(e, fim), fim ? 'Etapa concluída' : null);
  }
  if (t === 'item') {
    const i = S.itens.find(x => x.id === id), fim = i.status !== 'feito';
    return salvar(() => API.atualizar('itens', id, fim ? { status: 'feito', progresso: 100, concluido_em: HOJE } : { status: 'fazendo', concluido_em: null }), fim ? 'Item concluído' : null);
  }
}
function abrirAg(t, id, d) {
  if (t === 'rotina') return d > HOJE ? modalRotina(S.rotinas.find(r => r.id === id)) : modalExec(id, d);
  if (t === 'paralela') return modalParalela(S.paralelas.find(a => a.id === id));
  if (t === 'etapa') { const e = S.etapas.find(x => x.id === id); return modalParalela(parDe(e)); }
  if (t === 'item') return modalItem(S.itens.find(x => x.id === id));
}

(async function iniciar() {
  const t = ls.get('hub-tema', null); if (t) document.documentElement.dataset.theme = t;
  const online = CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY;
  if (online) {
    if (!window.supabase) { root.innerHTML = `<div class="login"><div class="card"><h2>Não foi possível carregar</h2><p class="muted">A biblioteca do banco de dados não carregou. Verifique a internet ou se a rede bloqueia cdn.jsdelivr.net.</p></div></div>`; return; }
    S.modo = 'online';
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const { data } = await sb.auth.getSession();
    S.sessao = data.session;
    sb.auth.onAuthStateChange((ev, sess) => {
      const antes = S.sessao && S.sessao.user.id; S.sessao = sess;
      if ((sess && sess.user.id) !== antes) { if (sess) recarregar(); else { S.me = null; render(); } }
    });
    if (S.sessao) await recarregar(); else render();
  } else {
    S.modo = 'teste';
    DEMO = ls.get(DEMO_KEY, null);
    if (!DEMO || !DEMO.pessoas || DEMO.versao !== 2) { DEMO = seedDemo(); salvarDemo(); }
    await recarregar();
  }
  if (!EMBED && location.protocol === 'https:') {
    try {
      const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l);
      const a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = 'icon-192.png'; document.head.appendChild(a);
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
    } catch (e) { }
  }
})();
